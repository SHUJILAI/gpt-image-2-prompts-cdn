# Batch upload template for publish-prompts.
# Usage: bin/publish-prompts batch inputs/<your-file>.yaml
#
# Required per entry: id, title, category, prompt
# Optional: everything else.
# id must be lower-kebab-case, unique across the manifest.

prompts:
  - id: example-isometric-tiny-room
    title: Isometric Tiny Room
    title_zh: 等距迷你房间
    category: Illustrations
    subcategory: Isometric
    tags: [isometric, room, cozy, 3d-render]
    difficulty: Intermediate
    aspect_ratio: "1:1"
    prompt: |
      Highly detailed isometric illustration of a cozy tiny home office,
      warm afternoon light, plants, vinyl records, soft pastel palette,
      Studio Ghibli inspired props, sharp clean linework.
    negative_prompt: ""
    color_palette: ["#F5E1C8", "#A2C5AC", "#6B7AB5", "#222222"]
    style_keywords: [isometric, cozy, pastel, illustration]
    use_cases: ["app onboarding hero", "blog post cover"]
    tip: Mention the time of day to bias lighting; ask for "sharp clean linework" to avoid blur.
    tip_zh: 加上"warm afternoon light"等时间描述更易控制氛围。
    author: ""
    source_url: ""
    license: Reference-only
    featured: false
    trending_score: 0.5
    # image_path: ./uploads/my-existing-render.png  # optional: skip generation, upload local file
